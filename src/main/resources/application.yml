server:
    port: 8081
spring:
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${ENTRA_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
                    audiences:
                        - ${ENTRA_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}

microservices:
    usuarios:
        base-url: http://localhost:8083
    productos:
        base-url: http://localhost:8084